<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-mark">AG</div>
      <h1 class="login-title">Albru Inventory</h1>
      <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <div class="field">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="username"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            [disabled]="loading()"
          />
          <label for="username">Usuario</label>
        </p-floatlabel>
      </div>

      <div class="field">
        <p-floatlabel variant="on">
          <p-password
            id="contrasena"
            [(ngModel)]="contrasena"
            name="contrasena"
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="current-password"
            [disabled]="loading()"
            styleClass="w-full"
          />
          <label for="contrasena">Contraseña</label>
        </p-floatlabel>
      </div>

      @if (error()) {
        <div class="login-error">{{ error() }}</div>
      }

      <p-button type="submit" [loading]="loading()" styleClass="w-full">
        <app-icon name="login" size="1rem" />
        Ingresar
      </p-button>
    </form>
  </div>
</div>
