<div class="app-shell">
  @if (auth.isLoggedIn()) {
    <aside class="app-sidebar">
      <a routerLink="/" class="brand">
        <span class="brand-mark">AG</span>
        <span class="brand-name">Albru Inventory</span>
      </a>

      <nav class="nav">
        <a
          routerLink="/estaciones"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-item"
        >
          <app-icon name="grid" size="1.25rem" />
          <span>Estaciones</span>
        </a>
        <a routerLink="/fisico" routerLinkActive="active" class="nav-item">
          <app-icon name="monitor" size="1.25rem" />
          <span>Físico</span>
        </a>
        <a routerLink="/logico" routerLinkActive="active" class="nav-item">
          <app-icon name="key" size="1.25rem" />
          <span>Lógico</span>
        </a>
        @if (auth.rol() === Rol.ADMIN) {
          <a routerLink="/admin" routerLinkActive="active" class="nav-item">
            <app-icon name="settings" size="1.25rem" />
            <span>Admin</span>
          </a>
        }
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <span class="user-empresa">{{ auth.empresa() }}</span>
          <span class="user-name">{{ auth.username() }}</span>
        </div>
        <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
          <app-icon name="logout" size="1.1rem" />
        </button>
      </div>
    </aside>
  }

  <main class="main" [class.has-nav]="auth.isLoggedIn()">
    <router-outlet />
  </main>

  @if (auth.isLoggedIn()) {
    <nav class="bottom-nav">
      <a
        routerLink="/estaciones"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="bottom-nav-item"
        pTooltip="Estaciones"
        tooltipPosition="top"
      >
        <app-icon name="grid" size="1.5rem" />
        <span>Estaciones</span>
      </a>
      <a routerLink="/fisico" routerLinkActive="active" class="bottom-nav-item" pTooltip="Físico" tooltipPosition="top">
        <app-icon name="monitor" size="1.5rem" />
        <span>Físico</span>
      </a>
      <a routerLink="/logico" routerLinkActive="active" class="bottom-nav-item" pTooltip="Lógico" tooltipPosition="top">
        <app-icon name="key" size="1.5rem" />
        <span>Lógico</span>
      </a>
      @if (auth.rol() === Rol.ADMIN) {
        <a routerLink="/admin" routerLinkActive="active" class="bottom-nav-item" pTooltip="Admin" tooltipPosition="top">
          <app-icon name="settings" size="1.5rem" />
          <span>Admin</span>
        </a>
      }
      <button class="bottom-nav-item bottom-logout" (click)="logout()" pTooltip="Cerrar sesión" tooltipPosition="top">
        <app-icon name="logout" size="1.5rem" />
        <span>Salir</span>
      </button>
    </nav>
  }
</div>
